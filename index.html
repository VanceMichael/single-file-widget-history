<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regex Lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f2;--border:#d1d1d6;
  --text:#1d1d1f;--text2:#6e6e73;--accent:#0071e3;--err:#ff3b30;
  --hl0:rgba(0,113,227,.22);--hl1:rgba(52,199,89,.22);--hl2:rgba(255,149,0,.22);
  --hl3:rgba(175,82,222,.22);--hl4:rgba(255,59,48,.22);--hl5:rgba(0,199,190,.22);
  --g0:rgba(0,113,227,.35);--g1:rgba(52,199,89,.35);--g2:rgba(255,149,0,.35);
  --g3:rgba(175,82,222,.35);--g4:rgba(255,59,48,.35);--g5:rgba(0,199,190,.35);
  --shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px;
  --drawer-w:320px;
}
[data-theme="dark"]{
  --bg:#1a1a1e;--surface:#2c2c2e;--surface2:#3a3a3c;--border:#48484a;
  --text:#f5f5f7;--text2:#98989d;--accent:#64d2ff;--err:#ff453a;
  --hl0:rgba(100,210,255,.18);--hl1:rgba(48,209,88,.18);--hl2:rgba(255,159,10,.18);
  --hl3:rgba(191,90,242,.18);--hl4:rgba(255,69,58,.18);--hl5:rgba(94,230,226,.18);
  --g0:rgba(100,210,255,.3);--g1:rgba(48,209,88,.3);--g2:rgba(255,159,10,.3);
  --g3:rgba(191,90,242,.3);--g4:rgba(255,69,58,.3);--g5:rgba(94,230,226,.3);
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
body{display:flex;flex-direction:column;padding:16px 20px;gap:14px;overflow:hidden;position:relative}

.header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-right{display:flex;align-items:center;gap:8px}
.lang-select{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;outline:none;transition:border-color .2s}
.lang-select:focus{border-color:var(--accent)}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-btn:hover{border-color:var(--accent)}
.theme-btn svg{width:18px;height:18px;fill:var(--text2);transition:fill .2s}
[data-theme="dark"] .theme-btn .icon-sun{display:block}
[data-theme="dark"] .theme-btn .icon-moon{display:none}
.theme-btn .icon-sun{display:none}
.history-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.history-btn:hover{border-color:var(--accent)}
.history-btn svg{width:18px;height:18px;fill:var(--text2);transition:fill .2s}

.regex-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);flex-shrink:0}
.regex-row{display:flex;gap:10px;align-items:center}
.regex-input-wrap{flex:1;position:relative}
.regex-input-wrap::before{content:"/";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;font-weight:600;font-family:monospace}
.regex-input-wrap::after{content:"/";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;font-weight:600;font-family:monospace}
.regex-input{width:100%;padding:8px 24px 8px 24px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:15px;font-family:"SF Mono",Menlo,Consolas,monospace;outline:none;transition:border-color .2s}
.regex-input:focus{border-color:var(--accent)}

.flags-row{display:flex;gap:8px;align-items:center;flex-shrink:0}
.flag-label{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);user-select:none;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);transition:all .15s}
.flag-label:has(input:checked){color:var(--accent);border-color:var(--accent);background:rgba(0,113,227,.08)}
[data-theme="dark"] .flag-label:has(input:checked){background:rgba(100,210,255,.1)}
.flag-label input{display:none}

.err-msg{margin-top:8px;font-size:13px;color:var(--err);font-weight:500;min-height:18px;word-break:break-all}

.editor-area{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.text-section{flex:1;display:flex;flex-direction:column;min-height:0}
.text-section label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.text-input{flex:1;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:14px;font-family:"SF Mono",Menlo,Consolas,monospace;line-height:1.6;resize:none;outline:none;transition:border-color .2s}
.text-input:focus{border-color:var(--accent)}
.highlight-layer{flex:1;overflow:auto;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;font-family:"SF Mono",Menlo,Consolas,monospace;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;position:relative;cursor:text;user-select:text}

.results-section{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);max-height:200px;overflow:auto}
.results-section h3{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.match-count{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.match-list{display:flex;flex-direction:column;gap:6px}
.match-item{font-size:13px;font-family:"SF Mono",Menlo,Consolas,monospace;background:var(--surface2);border-radius:5px;padding:8px 10px;line-height:1.5}
.match-item .idx{color:var(--accent);font-weight:700}
.match-item .range{color:var(--text2)}
.match-item .group-row{margin-top:3px;padding-left:12px;border-left:2px solid var(--border)}
.group-label{color:var(--text2)}

.hl{border-radius:2px;padding:1px 0}
.hl.g0{background:var(--g0);outline:1.5px solid rgba(0,113,227,.35);outline-offset:-1px}
.hl.g1{background:var(--g1);outline:1.5px solid rgba(52,199,89,.35);outline-offset:-1px}
.hl.g2{background:var(--g2);outline:1.5px solid rgba(255,149,0,.35);outline-offset:-1px}
.hl.g3{background:var(--g3);outline:1.5px solid rgba(175,82,222,.35);outline-offset:-1px}
.hl.g4{background:var(--g4);outline:1.5px solid rgba(255,59,48,.35);outline-offset:-1px}
.hl.g5{background:var(--g5);outline:1.5px solid rgba(94,230,226,.35);outline-offset:-1px}
.hl.gx{background:var(--hl0);outline:1.5px solid rgba(0,113,227,.2);outline-offset:-1px}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:var(--drawer-w);max-width:85vw;background:var(--surface);border-right:1px solid var(--border);z-index:101;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.1)}
.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-header h2{font-size:16px;font-weight:700}
.drawer-actions{display:flex;gap:6px;align-items:center}
.drawer-clear-btn{font-size:13px;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .15s}
.drawer-clear-btn:hover{color:var(--err);border-color:var(--err)}
.drawer-close-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.drawer-close-btn:hover{border-color:var(--accent)}
.drawer-close-btn svg{width:14px;height:14px;fill:var(--text2)}
.drawer-list{flex:1;overflow-y:auto;padding:8px}
.drawer-empty{padding:40px 16px;text-align:center;color:var(--text2);font-size:14px}
.history-item{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:border-color .15s;position:relative;background:var(--surface2)}
.history-item:hover{border-color:var(--accent)}
.history-item-pattern{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600;word-break:break-all;margin-bottom:4px}
.history-item-meta{font-size:12px;color:var(--text2)}
.history-item-text{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item-del{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.history-item:hover .history-item-del{opacity:1}
.history-item-del svg{width:14px;height:14px;fill:var(--text2)}
.history-item-del:hover svg{fill:var(--err)}

@media(max-width:600px){
  body{padding:10px 12px;gap:10px}
  .regex-row{flex-direction:column;align-items:stretch}
  .flags-row{justify-content:center}
}
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 data-i18n="historyTitle">历史记录</h2>
    <div class="drawer-actions">
      <button class="drawer-clear-btn" id="clearAllBtn" data-i18n="clearAll">清空</button>
      <button class="drawer-close-btn" id="drawerCloseBtn">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="drawer-list" id="drawerList">
    <div class="drawer-empty" id="drawerEmpty" data-i18n="emptyHistory">暂无记录</div>
  </div>
</div>

<div class="header">
  <h1 data-i18n="title">Regex Lab</h1>
  <div class="header-right">
    <button class="history-btn" id="historyBtn" data-i18n-title="historyTitle" title="历史记录">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7a6.97 6.97 0 01-4.95-2.05l-1.41 1.41A8.97 8.97 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </button>
    <select class="lang-select" id="langSelect">
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
    <button class="theme-btn" id="themeToggle" data-i18n-title="themeToggle" title="切换主题">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 6a6 6 0 100 12 6 6 0 000-12z"/></svg>
    </button>
  </div>
</div>

<div class="regex-panel">
  <div class="regex-row">
    <div class="regex-input-wrap">
      <input type="text" class="regex-input" id="regexInput" data-i18n-placeholder="regexPlaceholder" placeholder="输入正则表达式…" spellcheck="false" autocomplete="off">
    </div>
    <div class="flags-row">
      <label class="flag-label"><input type="checkbox" value="g" checked> g</label>
      <label class="flag-label"><input type="checkbox" value="i"> i</label>
      <label class="flag-label"><input type="checkbox" value="m"> m</label>
      <label class="flag-label"><input type="checkbox" value="s"> s</label>
      <label class="flag-label"><input type="checkbox" value="u"> u</label>
    </div>
  </div>
  <div class="err-msg" id="errMsg"></div>
</div>

<div class="editor-area">
  <div class="text-section">
    <label data-i18n="testText">测试文本</label>
    <textarea class="text-input" id="textInput" data-i18n-placeholder="testTextPlaceholder" placeholder="在这里输入待测试的文本…" spellcheck="false"></textarea>
  </div>
  <div class="text-section">
    <label data-i18n="matchHighlight">匹配高亮</label>
    <div class="highlight-layer" id="highlightLayer"></div>
  </div>
</div>

<div class="results-section">
  <h3 data-i18n="matchResults">匹配结果</h3>
  <div class="match-count" id="matchCount"></div>
  <div class="match-list" id="matchList"></div>
</div>

<script type="module">
import { loadLang, t, applyLang, detectLang, saveLang } from './i18n.js';
import { saveEntry, getAllEntries, deleteEntry, clearAll, debounceSave, startAutoSave } from './history.js';

var regexInput = document.getElementById('regexInput');
var textInput = document.getElementById('textInput');
var highlightLayer = document.getElementById('highlightLayer');
var matchCount = document.getElementById('matchCount');
var matchList = document.getElementById('matchList');
var errMsg = document.getElementById('errMsg');
var themeToggle = document.getElementById('themeToggle');
var flagsCheckboxes = document.querySelectorAll('.flag-label input');
var langSelect = document.getElementById('langSelect');
var historyBtn = document.getElementById('historyBtn');
var drawerOverlay = document.getElementById('drawerOverlay');
var drawer = document.getElementById('drawer');
var drawerList = document.getElementById('drawerList');
var drawerEmpty = document.getElementById('drawerEmpty');
var clearAllBtn = document.getElementById('clearAllBtn');
var drawerCloseBtn = document.getElementById('drawerCloseBtn');

var GROUP_COLORS = ['g0','g1','g2','g3','g4','g5'];
var currentLang = detectLang();
var langPack = null;

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getFlags(){
  var f = '';
  flagsCheckboxes.forEach(function(cb){ if(cb.checked) f += cb.value; });
  return f;
}

function buildRanges(text, re){
  var ranges = [];
  if(re.global){
    var m;
    var guard = 0;
    while((m = re.exec(text)) !== null){
      if(++guard > 50000) break;
      if(m[0].length === 0){ re.lastIndex++; continue; }
      ranges.push({start:m.index, end:m.index+m[0].length, groups:m.slice(1)});
      re.lastIndex = m.index + m[0].length;
    }
  } else {
    var m = re.exec(text);
    if(m) ranges.push({start:m.index, end:m.index+m[0].length, groups:m.slice(1)});
  }
  return ranges;
}

function renderHighlight(text, ranges){
  if(!ranges.length){
    highlightLayer.innerHTML = escapeHtml(text);
    return;
  }
  var parts = [];
  var last = 0;
  for(var i=0;i<ranges.length;i++){
    var r = ranges[i];
    if(r.start > last) parts.push({type:'text', text:text.slice(last, r.start)});
    var colorIdx = i % GROUP_COLORS.length;
    parts.push({type:'hl', text:text.slice(r.start, r.end), cls:GROUP_COLORS[colorIdx]});
    last = r.end;
  }
  if(last < text.length) parts.push({type:'text', text:text.slice(last)});

  var html = '';
  for(var j=0;j<parts.length;j++){
    var p = parts[j];
    var safe = escapeHtml(p.text);
    if(p.type === 'hl'){
      html += '<span class="hl '+p.cls+'">'+safe+'</span>';
    } else {
      html += safe;
    }
  }
  highlightLayer.innerHTML = html;
}

function renderResults(ranges, text){
  if(!ranges.length){
    matchCount.textContent = t(langPack, 'noMatch');
    matchList.innerHTML = '';
    return;
  }
  matchCount.textContent = t(langPack, 'matchCount', {count: ranges.length});
  var html = '';
  for(var i=0;i<ranges.length;i++){
    var r = ranges[i];
    var colorCls = GROUP_COLORS[i % GROUP_COLORS.length];
    html += '<div class="match-item">';
    html += '<span class="idx">#'+(i+1)+'</span> ';
    html += '<span class="range">['+r.start+', '+r.end+')</span>';
    html += ' <code>'+escapeHtml(text.slice(r.start, r.end))+'</code>';
    if(r.groups && r.groups.length){
      for(var g=0;g<r.groups.length;g++){
        var gVal = r.groups[g];
        html += '<div class="group-row">';
        html += '<span class="group-label">$'+(g+1)+':</span> ';
        html += gVal !== undefined ? escapeHtml(gVal) : '<span class="group-label">undefined</span>';
        html += '</div>';
      }
    }
    html += '</div>';
  }
  matchList.innerHTML = html;
}

var debounceTimer = null;
function run(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doRun, 80);
}

function doRun(){
  var pattern = regexInput.value;
  var flags = getFlags();
  var text = textInput.value;
  errMsg.textContent = '';

  if(!pattern){
    highlightLayer.innerHTML = escapeHtml(text);
    matchCount.textContent = '';
    matchList.innerHTML = '';
    return;
  }

  try{
    var re = new RegExp(pattern, flags);
  } catch(e){
    errMsg.textContent = e.message;
    highlightLayer.innerHTML = escapeHtml(text);
    matchCount.textContent = '';
    matchList.innerHTML = '';
    return;
  }

  var ranges = buildRanges(text, re);
  renderHighlight(text, ranges);
  renderResults(ranges, text);
}

function getState(){
  return { pattern: regexInput.value, flags: getFlags(), testText: textInput.value };
}

function onInput(){
  run();
  debounceSave(getState, refreshDrawer);
}

regexInput.addEventListener('input', onInput);
textInput.addEventListener('input', onInput);
flagsCheckboxes.forEach(function(cb){ cb.addEventListener('change', onInput); });

function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('regex-lab-theme', t); } catch(e){}
}

themeToggle.addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

try{
  var saved = localStorage.getItem('regex-lab-theme');
  if(saved) setTheme(saved);
}catch(e){}

function openDrawer(){
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
  refreshDrawer();
}

function closeDrawer(){
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
}

historyBtn.addEventListener('click', openDrawer);
drawerOverlay.addEventListener('click', closeDrawer);
drawerCloseBtn.addEventListener('click', closeDrawer);

clearAllBtn.addEventListener('click', async function(){
  await clearAll();
  refreshDrawer();
});

async function refreshDrawer(){
  var entries = await getAllEntries();
  if(!entries.length){
    drawerList.innerHTML = '';
    var emptyEl = document.createElement('div');
    emptyEl.className = 'drawer-empty';
    emptyEl.setAttribute('data-i18n', 'emptyHistory');
    emptyEl.textContent = langPack ? t(langPack, 'emptyHistory') : '暂无记录';
    drawerList.appendChild(emptyEl);
    return;
  }
  var html = '';
  for(var i = 0; i < entries.length; i++){
    var e = entries[i];
    var d = new Date(e.createdAt);
    var timeStr = d.toLocaleString();
    var snippet = e.testText.length > 40 ? e.testText.slice(0, 40) + '…' : e.testText;
    html += '<div class="history-item" data-id="'+e.id+'">';
    html += '<div class="history-item-pattern">/'+escapeHtml(e.pattern)+'/'+escapeHtml(e.flags)+'</div>';
    html += '<div class="history-item-meta">'+timeStr+'</div>';
    html += '<div class="history-item-text">'+escapeHtml(snippet)+'</div>';
    html += '<button class="history-item-del" data-del-id="'+e.id+'"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>';
    html += '</div>';
  }
  drawerList.innerHTML = html;

  drawerList.querySelectorAll('.history-item').forEach(function(item){
    item.addEventListener('click', function(ev){
      if(ev.target.closest('.history-item-del')) return;
      var id = Number(item.getAttribute('data-id'));
      restoreEntry(id);
    });
  });

  drawerList.querySelectorAll('.history-item-del').forEach(function(btn){
    btn.addEventListener('click', async function(ev){
      ev.stopPropagation();
      var id = Number(btn.getAttribute('data-del-id'));
      await deleteEntry(id);
      refreshDrawer();
    });
  });
}

async function restoreEntry(id){
  var entries = await getAllEntries();
  var entry = entries.find(function(e){ return e.id === id; });
  if(!entry) return;
  regexInput.value = entry.pattern;
  textInput.value = entry.testText;
  flagsCheckboxes.forEach(function(cb){
    cb.checked = entry.flags.indexOf(cb.value) !== -1;
  });
  doRun();
  closeDrawer();
}

langSelect.value = currentLang;

async function switchLang(lang){
  currentLang = lang;
  saveLang(lang);
  langPack = await loadLang(lang);
  applyLang(langPack);
  doRun();
  if(drawer.classList.contains('open')) refreshDrawer();
}

langSelect.addEventListener('change', function(){
  switchLang(langSelect.value);
});

(async function init(){
  langPack = await loadLang(currentLang);
  applyLang(langPack);
  doRun();
  startAutoSave(getState, function(){
    if(drawer.classList.contains('open')) refreshDrawer();
  });
})();
</script>
