<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regex Lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f2;--border:#d1d1d6;
  --text:#1d1d1f;--text2:#6e6e73;--accent:#0071e3;--err:#ff3b30;
  --hl0:rgba(0,113,227,.22);--hl1:rgba(52,199,89,.22);--hl2:rgba(255,149,0,.22);
  --hl3:rgba(175,82,222,.22);--hl4:rgba(255,59,48,.22);--hl5:rgba(0,199,190,.22);
  --g0:rgba(0,113,227,.35);--g1:rgba(52,199,89,.35);--g2:rgba(255,149,0,.35);
  --g3:rgba(175,82,222,.35);--g4:rgba(255,59,48,.35);--g5:rgba(0,199,190,.35);
  --shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px;
}
[data-theme="dark"]{
  --bg:#1a1a1e;--surface:#2c2c2e;--surface2:#3a3a3c;--border:#48484a;
  --text:#f5f5f7;--text2:#98989d;--accent:#64d2ff;--err:#ff453a;
  --hl0:rgba(100,210,255,.18);--hl1:rgba(48,209,88,.18);--hl2:rgba(255,159,10,.18);
  --hl3:rgba(191,90,242,.18);--hl4:rgba(255,69,58,.18);--hl5:rgba(94,230,226,.18);
  --g0:rgba(100,210,255,.3);--g1:rgba(48,209,88,.3);--g2:rgba(255,159,10,.3);
  --g3:rgba(191,90,242,.3);--g4:rgba(255,69,58,.3);--g5:rgba(94,230,226,.3);
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
body{display:flex;flex-direction:column;padding:16px 20px;gap:14px;overflow:hidden}

.app-container{display:flex;flex:1;min-height:0;gap:14px;position:relative}
.main-content{display:flex;flex-direction:column;flex:1;min-height:0;gap:14px}

.header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-right{display:flex;align-items:center;gap:8px}
.history-btn,.theme-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.history-btn:hover,.theme-btn:hover{border-color:var(--accent)}
.history-btn svg,.theme-btn svg{width:18px;height:18px;fill:var(--text2);transition:fill .2s}
[data-theme="dark"] .theme-btn .icon-sun{display:block}
[data-theme="dark"] .theme-btn .icon-moon{display:none}
.theme-btn .icon-sun{display:none}

.lang-select{height:38px;padding:0 12px;border:1.5px solid var(--border);border-radius:19px;background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;outline:none;transition:all .2s}
.lang-select:hover{border-color:var(--accent)}

.regex-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);flex-shrink:0}
.regex-row{display:flex;gap:10px;align-items:center}
.regex-input-wrap{flex:1;position:relative}
.regex-input-wrap::before{content:"/";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;font-weight:600;font-family:monospace}
.regex-input-wrap::after{content:"/";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;font-weight:600;font-family:monospace}
.regex-input{width:100%;padding:8px 24px 8px 24px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:15px;font-family:"SF Mono",Menlo,Consolas,monospace;outline:none;transition:border-color .2s}
.regex-input:focus{border-color:var(--accent)}

.flags-row{display:flex;gap:8px;align-items:center;flex-shrink:0}
.flag-label{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);user-select:none;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);transition:all .15s}
.flag-label:has(input:checked){color:var(--accent);border-color:var(--accent);background:rgba(0,113,227,.08)}
[data-theme="dark"] .flag-label:has(input:checked){background:rgba(100,210,255,.1)}
.flag-label input{display:none}

.err-msg{margin-top:8px;font-size:13px;color:var(--err);font-weight:500;min-height:18px;word-break:break-all}

.editor-area{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.text-section{flex:1;display:flex;flex-direction:column;min-height:0}
.text-section label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.text-input{flex:1;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:14px;font-family:"SF Mono",Menlo,Consolas,monospace;line-height:1.6;resize:none;outline:none;transition:border-color .2s}
.text-input:focus{border-color:var(--accent)}
.highlight-layer{flex:1;overflow:auto;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;font-family:"SF Mono",Menlo,Consolas,monospace;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;position:relative;cursor:text;user-select:text}

.results-section{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);max-height:200px;overflow:auto}
.results-section h3{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.match-count{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.match-list{display:flex;flex-direction:column;gap:6px}
.match-item{font-size:13px;font-family:"SF Mono",Menlo,Consolas,monospace;background:var(--surface2);border-radius:5px;padding:8px 10px;line-height:1.5}
.match-item .idx{color:var(--accent);font-weight:700}
.match-item .range{color:var(--text2)}
.match-item .group-row{margin-top:3px;padding-left:12px;border-left:2px solid var(--border)}
.group-label{color:var(--text2)}

.hl{border-radius:2px;padding:1px 0}
.hl.g0{background:var(--g0);outline:1.5px solid rgba(0,113,227,.35);outline-offset:-1px}
.hl.g1{background:var(--g1);outline:1.5px solid rgba(52,199,89,.35);outline-offset:-1px}
.hl.g2{background:var(--g2);outline:1.5px solid rgba(255,149,0,.35);outline-offset:-1px}
.hl.g3{background:var(--g3);outline:1.5px solid rgba(175,82,222,.35);outline-offset:-1px}
.hl.g4{background:var(--g4);outline:1.5px solid rgba(255,59,48,.35);outline-offset:-1px}
.hl.g5{background:var(--g5);outline:1.5px solid rgba(94,230,226,.35);outline-offset:-1px}
.hl.gx{background:var(--hl0);outline:1.5px solid rgba(0,113,227,.2);outline-offset:-1px}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:all .3s;z-index:998}
.drawer-overlay.open{opacity:1;visibility:visible}

.drawer{position:fixed;top:0;left:0;height:100%;width:320px;max-width:90vw;background:var(--surface);box-shadow:2px 0 20px rgba(0,0,0,.15);transform:translateX(-100%);transition:transform .3s ease;z-index:999;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}

.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-header h2{font-size:17px;font-weight:600}
.drawer-actions{display:flex;align-items:center;gap:8px}
.clear-all-btn{padding:6px 12px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .2s}
.clear-all-btn:hover{color:var(--err);border-color:var(--err)}
.close-drawer-btn{width:32px;height:32px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .2s}
.close-drawer-btn:hover{background:var(--surface2)}
.close-drawer-btn svg{width:16px;height:16px;fill:var(--text2)}

.drawer-list{flex:1;overflow-y:auto;padding:8px}
.history-empty{padding:40px 20px;text-align:center;color:var(--text2);font-size:14px}
.history-item{padding:12px 14px;margin-bottom:8px;background:var(--surface2);border-radius:8px;cursor:pointer;transition:all .2s;position:relative}
.history-item:hover{background:var(--border)}
.history-item-pattern{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--accent);font-weight:500;margin-bottom:6px;word-break:break-all;line-height:1.4;max-height:40px;overflow:hidden}
.history-item-text{font-size:12px;color:var(--text2);word-break:break-all;line-height:1.4;max-height:36px;overflow:hidden;margin-bottom:6px}
.history-item-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text2)}
.history-item-flags{font-family:"SF Mono",Menlo,Consolas,monospace}
.history-item-delete{position:absolute;top:8px;right:8px;width:24px;height:24px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;opacity:0;transition:all .2s}
.history-item:hover .history-item-delete{opacity:1}
.history-item-delete:hover{background:var(--err);opacity:1!important}
.history-item-delete svg{width:12px;height:12px;fill:var(--text2)}
.history-item-delete:hover svg{fill:#fff}

@media(max-width:600px){
  body{padding:10px 12px;gap:10px}
  .regex-row{flex-direction:column;align-items:stretch}
  .flags-row{justify-content:center}
}
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 data-i18n="historyTitle">历史记录</h2>
    <div class="drawer-actions">
      <button class="clear-all-btn" id="clearAllBtn" data-i18n="clearAll">清空全部</button>
      <button class="close-drawer-btn" id="closeDrawerBtn" data-i18n-title="closeHistory" title="关闭历史记录">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<div class="app-container">
  <div class="main-content">
    <div class="header">
      <div class="header-left">
        <button class="history-btn" id="historyBtn" data-i18n-title="openHistory" title="打开历史记录">
          <svg viewBox="0 0 24 24"><path d="M12 5v7l5 3m6-3a9 9 0 11-3-6.7"/></svg>
        </button>
        <h1 data-i18n="title">Regex Lab</h1>
      </div>
      <div class="header-right">
        <select class="lang-select" id="langSelect">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
        <button class="theme-btn" id="themeToggle" data-i18n-title="toggleTheme" title="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 6a6 6 0 100 12 6 6 0 000-12z"/></svg>
        </button>
      </div>
    </div>

    <div class="regex-panel">
      <div class="regex-row">
        <div class="regex-input-wrap">
          <input type="text" class="regex-input" id="regexInput" data-i18n-placeholder="regexPlaceholder" placeholder="输入正则表达式…" spellcheck="false" autocomplete="off">
        </div>
        <div class="flags-row">
          <label class="flag-label"><input type="checkbox" value="g" checked> g</label>
          <label class="flag-label"><input type="checkbox" value="i"> i</label>
          <label class="flag-label"><input type="checkbox" value="m"> m</label>
          <label class="flag-label"><input type="checkbox" value="s"> s</label>
          <label class="flag-label"><input type="checkbox" value="u"> u</label>
        </div>
      </div>
      <div class="err-msg" id="errMsg"></div>
    </div>

    <div class="editor-area">
      <div class="text-section">
        <label data-i18n="testText">测试文本</label>
        <textarea class="text-input" id="textInput" data-i18n-placeholder="testTextPlaceholder" placeholder="在这里输入待测试的文本…" spellcheck="false"></textarea>
      </div>
      <div class="text-section">
        <label data-i18n="highlight">匹配高亮</label>
        <div class="highlight-layer" id="highlightLayer"></div>
      </div>
    </div>

    <div class="results-section">
      <h3 data-i18n="results">匹配结果</h3>
      <div class="match-count" id="matchCount"></div>
      <div class="match-list" id="matchList"></div>
    </div>
  </div>
</div>

<script type="module">
import { initI18n, setLang, getCurrentLang, onLangChange, t } from './i18n.js';
import { initHistory, getAllHistory, deleteHistory, clearAllHistory, debouncedSaveHistory, onHistoryChange } from './history.js';
import { initCore, restoreRecord, refreshResults, escapeHtml } from './core.js';

const regexInput = document.getElementById('regexInput');
const textInput = document.getElementById('textInput');
const highlightLayer = document.getElementById('highlightLayer');
const matchCount = document.getElementById('matchCount');
const matchList = document.getElementById('matchList');
const errMsg = document.getElementById('errMsg');
const themeToggle = document.getElementById('themeToggle');
const flagsCheckboxes = document.querySelectorAll('.flag-label input');
const langSelect = document.getElementById('langSelect');
const historyBtn = document.getElementById('historyBtn');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const closeDrawerBtn = document.getElementById('closeDrawerBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const drawerList = document.getElementById('drawerList');

function formatTimestamp(ts) {
  const date = new Date(ts);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMins / 60);
  const diffDays = Math.floor(diffHours / 24);

  if (diffMins < 1) return '刚刚';
  if (diffMins < 60) return diffMins + ' 分钟前';
  if (diffHours < 24) return diffHours + ' 小时前';
  if (diffDays < 7) return diffDays + ' 天前';

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');
  return y + '-' + m + '-' + d + ' ' + hh + ':' + mm;
}

async function renderHistoryList() {
  const records = await getAllHistory();
  if (!records.length) {
    drawerList.innerHTML = '<div class="history-empty" data-i18n="historyEmpty">' + t('historyEmpty') + '</div>';
    return;
  }

  let html = '';
  records.forEach(function (record) {
    const patternText = record.pattern || '(empty)';
    const textPreview = (record.text || '').replace(/\s+/g, ' ').trim() || '(empty)';
    const flagsText = record.flags || '(no flags)';

    html += '<div class="history-item" data-id="' + record.id + '">';
    html += '<div class="history-item-pattern">/' + escapeHtml(patternText) + '/' + escapeHtml(record.flags || '') + '</div>';
    html += '<div class="history-item-text">' + escapeHtml(textPreview) + '</div>';
    html += '<div class="history-item-meta">';
    html += '<span class="history-item-flags">' + flagsText + '</span>';
    html += '<span>' + formatTimestamp(record.timestamp) + '</span>';
    html += '</div>';
    html += '<button class="history-item-delete" data-delete-id="' + record.id + '" data-i18n-title="deleteItem" title="' + t('deleteItem') + '">';
    html += '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    html += '</button>';
    html += '</div>';
  });

  drawerList.innerHTML = html;

  drawerList.querySelectorAll('.history-item').forEach(function (item) {
    item.addEventListener('click', async function (e) {
      if (e.target.closest('.history-item-delete')) return;
      const id = item.getAttribute('data-id');
      const records = await getAllHistory();
      const record = records.find(function (r) { return r.id === id; });
      if (record) {
        restoreRecord(record);
        closeDrawer();
      }
    });
  });

  drawerList.querySelectorAll('.history-item-delete').forEach(function (btn) {
    btn.addEventListener('click', async function (e) {
      e.stopPropagation();
      const id = btn.getAttribute('data-delete-id');
      await deleteHistory(id);
    });
  });
}

function openDrawer() {
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
  renderHistoryList();
}

function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('regex-lab-theme', theme); } catch (e) { }
}

async function main() {
  await initI18n();

  const savedLang = getCurrentLang();
  if (langSelect) {
    langSelect.value = savedLang;
    langSelect.addEventListener('change', function () {
      setLang(langSelect.value);
    });
  }

  onLangChange(function () {
    refreshResults();
    if (drawer.classList.contains('open')) {
      renderHistoryList();
    }
  });

  await initHistory();

  initCore({
    regexInput: regexInput,
    textInput: textInput,
    highlightLayer: highlightLayer,
    matchCount: matchCount,
    matchList: matchList,
    errMsg: errMsg,
    flagsCheckboxes: flagsCheckboxes
  }, function (state) {
    debouncedSaveHistory(state);
  });

  onHistoryChange(function () {
    if (drawer.classList.contains('open')) {
      renderHistoryList();
    }
  });

  if (historyBtn) historyBtn.addEventListener('click', openDrawer);
  if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);
  if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeDrawer);
  if (clearAllBtn) clearAllBtn.addEventListener('click', async function () {
    if (confirm(t('clearAll') + '?')) {
      await clearAllHistory();
    }
  });

  if (themeToggle) {
    themeToggle.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'dark' ? 'light' : 'dark');
    });
  }

  try {
    var saved = localStorage.getItem('regex-lab-theme');
    if (saved) setTheme(saved);
  } catch (e) { }
}

main();
</script>
</body>
</html>
